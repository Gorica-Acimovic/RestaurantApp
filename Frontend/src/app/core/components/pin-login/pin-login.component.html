<div class="auth-page">
  <div class="auth-card">
    <h1>Staff sign in</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>PIN</mat-label>
        <input
          matInput
          type="password"
          inputmode="numeric"
          maxlength="4"
          formControlName="pin"
        />
        @if (form.controls['pin'].hasError('required')) {
          <mat-error>PIN is required.</mat-error>
        } @else if (form.controls['pin'].hasError('pattern')) {
          <mat-error>PIN must have exactly 4 digits.</mat-error>
        }
      </mat-form-field>

      @if (errorMessage) {
        <p class="form-error">{{ errorMessage }}</p>
      }

      <button type="submit" class="button primary">Sign in</button>
    </form>

    <div class="auth-links">
      <p>Not a staff? <a routerLink="/login">Sign in with email</a></p>
    </div>
  </div>
</div>
