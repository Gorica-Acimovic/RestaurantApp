<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Waiter sign in</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>PIN</mat-label>
          <input
            matInput
            type="password"
            inputmode="numeric"
            maxlength="4"
            formControlName="pin"
          />
          @if (form.controls['pin'].hasError('required')) {
            <mat-error>PIN is required.</mat-error>
          } @else if (form.controls['pin'].hasError('pattern')) {
            <mat-error>PIN must have exactly 4 digits.</mat-error>
          }
        </mat-form-field>

        @if (errorMessage) {
          <p class="form-error">{{ errorMessage }}</p>
        }

        <button mat-flat-button type="submit" class="full-width">Sign in</button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <a mat-button routerLink="/login">Sign in with email</a>
    </mat-card-actions>
  </mat-card>
</div>
