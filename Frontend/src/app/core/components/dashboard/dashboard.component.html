<nav class="navbar">
  <a routerLink="/" class="logo">Restaurant</a>

  <div class="links">
    @if (session?.role === 'Admin') {
      <a routerLink="/dashboard/managers" routerLinkActive="active">Managers</a>
    }

    @if (session?.role === 'Manager') {
      <a routerLink="/dashboard/waiters" routerLinkActive="active">Waiters</a>
      <a routerLink="/dashboard/menu" routerLinkActive="active">Menu</a>
      <a routerLink="/dashboard/reviews" routerLinkActive="active">Reviews</a>
    }

    @if (session?.role !== 'Guest') {
      <a routerLink="/dashboard/tables" routerLinkActive="active">Hall</a>
      <a routerLink="/dashboard/reservations" routerLinkActive="active">Reservations</a>
    }

    @if (session?.role === 'Guest') {
      <a routerLink="/dashboard/my-reservations" routerLinkActive="active">My reservations</a>
    }

    <span class="user">{{ session?.firstName }} {{ session?.lastName }} ({{ session?.role }})</span>
    <button type="button" (click)="logout()">Log out</button>
  </div>
</nav>

<main class="content">
  <router-outlet></router-outlet>
</main>
